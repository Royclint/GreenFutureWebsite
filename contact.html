<html lang="en">
<head>

</head>
<body>
  <!-- Header with navigation -->
  <header>
    <h1>Contact GreenFuture</h1>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="projects.html">Projects</a></li>
        <li><a href="enquiry.html">Enquiry</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <!-- Main content: contact form -->
  <main>
    <section class="form-section">
      <h2>Contact Us</h2>
      <p>Have a question or need more information? Send us a message below.</p>

      <!-- Contact form -->
      <form>
        <!-- Name field -->
        <label for="name">Your Name:</label>
        <input type="text" id="name" name="name" placeholder="Enter your name" required>

        <!-- Email field -->
        <label for="email">Your Email:</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required>

        <!-- Subject field -->
        <label for="subject">Subject:</label>
        <input type="text" id="subject" name="subject" placeholder="Message subject" required>

        <!-- Message field -->
        <label for="message">Message:</label>
        <textarea id="message" name="message" rows="5" placeholder="Type your message here..." required></textarea>

        <!-- Submit button -->
        <button type="submit">Send Message</button>
      </form>

      <!-- Extra contact info -->
      <div class="contact-info">
        <h3>Other Ways to Reach Us</h3>
        <p>Email: info@greenfuture.org</p>
        <p>Phone: +27 82 123 4567</p>
        <p>Location: Mbombela, Mpumalanga, South Africa</p>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer>

</body>
